name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows-only project: it speaks HID feature reports through Windows and
    # stores secrets with DPAPI.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m compileall -q quadcastlight miclight.py miclight_gui.pyw
      - name: Run tests
        # The suite fakes the device, so no QuadCast is needed on the runner.
        run: python -m unittest discover -s . -p "test_*.py" -v
