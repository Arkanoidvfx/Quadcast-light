name: release

# Tag a version and the exe builds here, so a published binary is traceable to
# a commit rather than to somebody's machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2
      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py"
      - name: Build
        run: pyinstaller --noconfirm QuadcastLight.spec
      - name: Check the exe starts
        # A packaged Qt Quick app fails at runtime, not at build time, when a
        # QML module or Qt plugin did not make it into the bundle, and it dies
        # within seconds of starting. The runner has no microphone, which the
        # app tolerates: it sits in its event loop either way. So staying alive
        # is the pass, and exiting on its own is the failure.
        run: |
          $process = Start-Process -FilePath dist\QuadcastLight.exe -PassThru
          Start-Sleep -Seconds 30
          if ($process.HasExited) {
            Write-Host "the packaged app exited on its own, code $($process.ExitCode)"
            exit 1
          }
          $process.Kill()
          Write-Host "still running after 30s"
      - uses: actions/upload-artifact@v4
        with:
          name: QuadcastLight-exe
          path: dist/QuadcastLight.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${env:GITHUB_REF_NAME}" dist\QuadcastLight.exe --generate-notes --title "${env:GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
